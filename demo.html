
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CHỢ ONLINE 24H</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#a8cb83;overflow:hidden}
header{height:58px;background:#70452d;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.brand{font-weight:bold;font-size:18px}
button{border:0;border-radius:20px;padding:10px 14px;background:#f5d58c;color:#55351f;font-weight:bold}
#game{height:calc(100dvh - 58px);overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block}
.grass{fill:#a9ce83}
.path{fill:#d9c49a;stroke:#b49a6d;stroke-width:5}
.shopbody{fill:#e9c58b;stroke:#805438;stroke-width:4}
.roof{fill:#a94e39;stroke:#713a2d;stroke-width:5}
.sign{fill:#f8df9c;stroke:#805438;stroke-width:3}
.shoptext{font-size:15px;font-weight:bold;fill:#573a25;text-anchor:middle}
.tree{fill:#4f914b;stroke:#39723b;stroke-width:4}
.trunk{fill:#805438}
.lamp{fill:#ffed9b;stroke:#9b6639;stroke-width:4}
</style>
</head>
<body>
<header>
<div class="brand">🏮 CHỢ ONLINE 24H</div>
<button id="dayBtn">🌙 Ban đêm</button>
</header>

<div id="game">
<svg id="world" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
<g id="scene">
<rect x="-1000" y="-1000" width="3000" height="3000" class="grass"/>

<!-- Đường đi -->
<path class="path" d="M500 40 L880 290 L880 530 L500 770 L120 530 L120 290 Z"/>

<!-- Quảng trường -->
<ellipse cx="500" cy="410" rx="225" ry="155" fill="#b99a70" stroke="#806b50" stroke-width="9"/>
<ellipse cx="500" cy="410" rx="195" ry="128" fill="#e8d5ae" stroke="#c0a77c" stroke-width="5"/>
<ellipse cx="500" cy="410" rx="145" ry="90" fill="#d9c49a" stroke="#b49a6d" stroke-width="3"/>
<text x="500" y="400" text-anchor="middle" font-size="30" font-weight="bold" fill="#775333">CHỢ ONLINE</text>
<text x="500" y="435" text-anchor="middle" font-size="25" fill="#775333">24H</text>

<!-- 12 sạp hàng -->
<g id="shops"></g>

<!-- Cây và đèn -->
<g id="decor"></g>

<!-- Khách tham quan -->
<g id="people"></g>

<!-- Nhân vật của bạn -->
<g id="player" transform="translate(500 470)">
<ellipse cx="0" cy="18" rx="17" ry="7" fill="#64784c" opacity=".4"/>
<circle cx="0" cy="0" r="15" fill="#f1bd91" stroke="#754d37" stroke-width="3"/>
<path d="M-14 -5 Q0 -25 14 -5" fill="#4c3025"/>
<circle cx="-5" cy="1" r="2" fill="#35271f"/>
<circle cx="5" cy="1" r="2" fill="#35271f"/>
<path d="M-5 8 Q0 12 5 8" fill="none" stroke="#a64e43" stroke-width="2"/>
<path d="M-12 17 L12 17 L15 38 L-15 38 Z" fill="#4e8bc1" stroke="#345c7b" stroke-width="3"/>
<text x="0" y="55" text-anchor="middle" font-size="12" fill="#493626">Bạn</text>
</g>
</g>

<!-- Lớp ban đêm -->
<g id="nightLayer" opacity="0">
<rect x="-1000" y="-1000" width="3000" height="3000" fill="#152344" opacity=".48"/>
</g>
</svg>
</div>

<script>
const ns="http://www.w3.org/2000/svg";
const shops=document.getElementById("shops");
const decor=document.getElementById("decor");
const people=document.getElementById("people");

function add(tag,attrs,parent){
const e=document.createElementNS(ns,tag);
Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
parent.appendChild(e);
return e;
}

const positions=[
[250,150],[500,100],[750,150],
[180,300],[820,300],
[180,540],[820,540],
[250,670],[500,710],[750,670],
[365,100],[635,100]
];

const names=[
"Nông sản","Ẩm thực","Trái cây","Thời trang",
"Gia dụng","Hoa tươi","Đặc sản","Đồ uống",
"Thủ công","Mỹ phẩm","Đồ chơi","Tạp hóa"
];

positions.forEach((p,i)=>{
const g=add("g",{transform:`translate(${p[0]} ${p[1]})`},shops);

add("ellipse",{cx:0,cy:48,rx:58,ry:15,fill:"#688653",opacity:".35"},g);
add("rect",{x:-48,y:-8,width:96,height:58,rx:5,class:"shopbody"},g);
add("polygon",{points:"-58,-10 0,-48 58,-10 0,8",class:"roof"},g);
add("polygon",{points:"-58,-10 0,8 0,18 -58,0",fill:"#873e30"},g);
add("polygon",{points:"58,-10 0,8 0,18 58,0",fill:"#71382d"},g);
add("rect",{x:-36,y:2,width:72,height:20,rx:4,class:"sign"},g);

const t=add("text",{x:0,y:17,class:"shoptext"},g);
t.textContent=names[i];

add("rect",{x:-15,y:28,width:30,height:22,fill:"#805438"},g);
add("rect",{x:-40,y:27,width:15,height:14,fill:"#9bc6d3",stroke:"#805438","stroke-width":2},g);
});

// Cây xanh
[[90,170],[910,170],[90,620],[910,620],
[350,740],[650,740],[110,400],[890,400],
[350,45],[650,45]].forEach(p=>{
const g=add("g",{transform:`translate(${p[0]} ${p[1]})`},decor);
add("rect",{x:-5,y:0,width:10,height:30,class:"trunk"},g);
add("circle",{cx:0,cy:-5,r:25,class:"tree"},g);
add("circle",{cx:-12,cy:-13,r:12,fill:"#70ad5b"},g);
});

// Đèn lồng
[[350,285],[650,285],[350,550],[650,550]].forEach(p=>{
const g=add("g",{transform:`translate(${p[0]} ${p[1]})`},decor);
add("rect",{x:-3,y:0,width:6,height:30,fill:"#795638"},g);
add("path",{d:"M-13 0 L0 -16 L13 0 Z",fill:"#a66d3b"},g);
add("circle",{cx:0,cy:-8,r:7,class:"lamp"},g);
});

// Nhân vật trong chợ
[[410,330],[590,330],[400,490],[600,480],[470,560],[540,560]].forEach((p,i)=>{
const g=add("g",{transform:`translate(${p[0]} ${p[1]})`},people);
add("ellipse",{cx:0,cy:17,rx:11,ry:5,fill:"#657b50",opacity:".4"},g);
add("circle",{cx:0,cy:0,r:10,fill:"#f1c39c",stroke:"#79543d","stroke-width":2},g);
add("path",{d:"M-10 -3 Q0 -18 10 -3",fill:"#47352a"},g);
add("path",{d:"M-9 11 L9 11 L12 29 L-12 29 Z",fill:["#d36c5c","#68a0c9","#e2b94f"][i%3]},g);
});

// Di chuyển nhân vật
const world=document.getElementById("world");
const scene=document.getElementById("scene");
const player=document.getElementById("player");
let playerX=500,playerY=470;
let start=null,offsetX=0,offsetY=0,dragged=false;

function getPoint(e){
const r=world.getBoundingClientRect();
return {
x:(e.clientX-r.left)*1000/r.width,
y:(e.clientY-r.top)*800/r.height
};
}

world.addEventListener("pointerdown",e=>{
const p=getPoint(e);
start={x:e.clientX,y:e.clientY,px:p.x,py:p.y,ox:offsetX,oy:offsetY};
dragged=false;
world.setPointerCapture(e.pointerId);
});

world.addEventListener("pointermove",e=>{
if(!start)return;
const dx=e.clientX-start.x;
const dy=e.clientY-start.y;

if(Math.abs(dx)+Math.abs(dy)>8)dragged=true;

if(dragged){
offsetX=start.ox+dx*1000/world.clientWidth;
offsetY=start.oy+dy*800/world.clientHeight;
scene.setAttribute("transform",`translate(${offsetX} ${offsetY})`);
}
});

world.addEventListener("pointerup",e=>{
if(!start)return;

if(!dragged){
const p=getPoint(e);
playerX=p.x-offsetX;
playerY=p.y-offsetY;
player.setAttribute("transform",`translate(${playerX} ${playerY})`);
}
start=null;
});

world.addEventListener("pointercancel",()=>{start=null});

// Chuyển ngày và đêm
let night=false;
document.getElementById("dayBtn").onclick=()=>{
night=!night;
document.getElementById("nightLayer").setAttribute("opacity",night?"1":"0");
document.getElementById("dayBtn").textContent=night?"☀️ Ban ngày":"🌙 Ban đêm";
};
</script>
</body>
</html>
